<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 220">
<style>
  .ink { stroke: #2b2b2b; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
  .anim { transform-box: fill-box; transform-origin: center; }

  .lean { transform-origin: 50% 100%; animation: sway 4s ease-in-out infinite; }
  @keyframes sway { 50% { transform: rotate(-2.5deg); } }
  .tap { animation: tap .5s ease-in-out infinite alternate; }
  @keyframes tap { from { transform: translateY(-2px); } to { transform: translateY(1px); } }
  .note { animation: float 2.6s ease-in-out infinite; opacity: 0; }
  .note.b { animation-delay: 1.3s; }
  @keyframes float { 0% { opacity: 0; transform: translate(0,0); } 20% { opacity: 1; } 100% { opacity: 0; transform: translate(8px,-20px); } }
  .steam { animation: rise 2s ease-in-out infinite; }
  @keyframes rise { 0% { opacity: 0; transform: translateY(3px); } 40% { opacity: 1; } 100% { opacity: 0; transform: translateY(-8px); } }
  .hand-m { transform-box: view-box; transform-origin: 196px 42px; animation: spin 6s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .still-show { opacity: 1 !important; } }
</style>
<rect x="4" y="4" width="232" height="212" rx="28" fill="#d0ebff"/>
