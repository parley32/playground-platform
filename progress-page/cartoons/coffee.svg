<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180">
<style>
  .ink { stroke: #2b2b2b; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
  .steam, .head, .dot { transform-box: fill-box; transform-origin: center; }
  .steam { animation: rise 2.2s ease-in-out infinite; opacity: 0; }
  .steam.b { animation-delay: .7s; } .steam.c { animation-delay: 1.4s; }
  @keyframes rise { 0% { opacity: 0; transform: translateY(6px); } 40% { opacity: .9; } 100% { opacity: 0; transform: translateY(-16px); } }
  .head { transform-origin: 50% 100%; animation: nod 4s ease-in-out infinite; }
  @keyframes nod { 0%, 70%, 100% { transform: rotate(0); } 80% { transform: rotate(6deg); } 88% { transform: rotate(-2deg); } }
  .dot { animation: dots 1.8s steps(1) infinite; opacity: 0; }
  .dot.b { animation-delay: .3s; } .dot.c { animation-delay: .6s; }
  @keyframes dots { 0% { opacity: 1; } 70% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .steam, .dot { opacity: 1; } }
</style>

<rect class="ink" x="8" y="160" width="224" height="9" rx="3" fill="#b08968"/>
<!-- closed laptop -->
<rect class="ink" x="150" y="150" width="76" height="10" rx="3" fill="#ced4da"/>

<path class="ink" d="M74 162 C74 118 92 94 120 94 C148 94 166 118 166 162 Z" fill="#4c6ef5"/>
<path class="ink" d="M112 98 l-2 22 M128 98 l2 22" fill="none" stroke-width="2.4"/>

<g class="head">
  <circle class="ink" cx="120" cy="60" r="32" fill="#ffd7b0"/>
  <!-- bedhead -->
  <path class="ink" d="M88 58 C84 34 102 22 122 24 C144 24 158 40 152 58 C146 46 138 42 128 44 C124 36 112 36 106 44 C98 42 92 48 88 58 Z" fill="#3d2b1f"/>
  <path class="ink" d="M112 26 q-10 -14 -2 -20 M124 25 q2 -16 14 -16 M134 28 q12 -8 18 -2" fill="none"/>
  <circle class="ink" cx="88" cy="64" r="6" fill="#ffd7b0"/>
  <circle class="ink" cx="152" cy="64" r="6" fill="#ffd7b0"/>
  <!-- sleepy eyes -->
  <path class="ink" d="M100 60 a7 6 0 0 0 14 0 z" fill="#fff"/>
  <path class="ink" d="M126 60 a7 6 0 0 0 14 0 z" fill="#fff"/>
  <circle cx="107" cy="63" r="2.4" fill="#2b2b2b"/>
  <circle cx="133" cy="63" r="2.4" fill="#2b2b2b"/>
  <path d="M101 71 q6 3 12 0 M127 71 q6 3 12 0" fill="none" stroke="#c9a27e" stroke-width="2.4" stroke-linecap="round"/>
  <ellipse class="ink" cx="120" cy="80" rx="4" ry="3" fill="#a5523a" stroke-width="2.4"/>
</g>

<!-- giant mug held in both hands -->
<path class="ink" d="M98 100 h44 v40 q0 10 -10 10 h-24 q-10 0 -10 -10 z" fill="#fff"/>
<path class="ink" d="M142 108 q14 0 14 12 t-14 12" fill="none" stroke-width="4"/>
<text x="120" y="128" text-anchor="middle" font-family="Comic Sans MS, Chalkboard SE, cursive" font-size="11" font-weight="700" fill="#e8590c">FUEL</text>
<ellipse class="ink" cx="97" cy="122" rx="8" ry="10" fill="#ffd7b0"/>
<ellipse class="ink" cx="143" cy="132" rx="8" ry="9" fill="#ffd7b0"/>
<path class="steam" d="M108 96 q4 -5 10 -6 t12 -8" fill="none" stroke="#ced4da" stroke-width="2.4" stroke-linecap="round"/>
<path class="steam b" d="M120 96 q4 -5 10 -6 t12 -8" fill="none" stroke="#ced4da" stroke-width="2.4" stroke-linecap="round"/>
<path class="steam c" d="M132 96 q4 -5 10 -6 t12 -8" fill="none" stroke="#ced4da" stroke-width="2.4" stroke-linecap="round"/>

<!-- thought bubble -->
<circle class="ink" cx="170" cy="40" r="4" fill="#fff" stroke-width="2"/>
<ellipse class="ink" cx="196" cy="22" rx="26" ry="16" fill="#fff" stroke-width="2.4"/>
<circle class="dot" cx="186" cy="22" r="3" fill="#2b2b2b"/>
<circle class="dot b" cx="196" cy="22" r="3" fill="#2b2b2b"/>
<circle class="dot c" cx="206" cy="22" r="3" fill="#2b2b2b"/>
</svg>
