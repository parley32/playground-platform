<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 220">
<style>
  .ink { stroke: #2b2b2b; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
  .anim { transform-box: fill-box; transform-origin: center; }

  .flame { transform-origin: 50% 100%; animation: flick .5s ease-in-out infinite alternate; }
  .flame.b { animation-duration: .4s; animation-delay: .1s; } .flame.c { animation-duration: .3s; animation-delay: .2s; }
  @keyframes flick { from { transform: scale(1, 1); } to { transform: scale(1.04, 1.08); } }
  .shake { animation: shake .16s steps(2) infinite; }
  @keyframes shake { 0% { transform: translate(-.8px, 0); } 100% { transform: translate(.8px, 0); } }
  .jitter { animation: shake .12s steps(2) infinite; }
  .tap { animation: tap .13s ease-in-out infinite alternate; }
  .tap.r { animation-delay: .065s; }
  @keyframes tap { from { transform: translateY(-5px); } to { transform: translateY(1px); } }
  .arc { animation: blink .2s steps(2) infinite; }
  @keyframes blink { 50% { opacity: .2; } }
  .drop { animation: drip .9s ease-in infinite; }
  .drop.b { animation-delay: .45s; }
  @keyframes drip { from { opacity: 1; transform: translate(0,0); } to { opacity: 0; transform: translate(4px,12px); } }
  .fly { animation: 1.4s ease-out infinite; opacity: 0; }
  .f1 { animation-name: f1; } .f2 { animation-name: f2; animation-delay: .23s; } .f3 { animation-name: f3; animation-delay: .46s; }
  .f4 { animation-name: f4; animation-delay: .7s; } .f5 { animation-name: f5; animation-delay: .93s; } .f6 { animation-name: f6; animation-delay: 1.16s; }
  @keyframes f1 { 0% { opacity: 0; transform: translate(0,0) rotate(0); } 10% { opacity: 1; } 100% { opacity: 0; transform: translate(-70px,-60px) rotate(-280deg); } }
  @keyframes f2 { 0% { opacity: 0; transform: translate(0,0) rotate(0); } 10% { opacity: 1; } 100% { opacity: 0; transform: translate(72px,-64px) rotate(300deg); } }
  @keyframes f3 { 0% { opacity: 0; transform: translate(0,0) rotate(0); } 10% { opacity: 1; } 100% { opacity: 0; transform: translate(-84px,-10px) rotate(-200deg); } }
  @keyframes f4 { 0% { opacity: 0; transform: translate(0,0) rotate(0); } 10% { opacity: 1; } 100% { opacity: 0; transform: translate(82px,-14px) rotate(220deg); } }
  @keyframes f5 { 0% { opacity: 0; transform: translate(0,0) rotate(0); } 10% { opacity: 1; } 100% { opacity: 0; transform: translate(58px,-92px) rotate(180deg); } }
  @keyframes f6 { 0% { opacity: 0; transform: translate(0,0) rotate(0); } 10% { opacity: 1; } 100% { opacity: 0; transform: translate(-56px,-94px) rotate(-160deg); } }
  .paper { animation: paper 1.8s ease-out infinite; }
  @keyframes paper { 0% { opacity: 1; transform: translate(0,0) rotate(0); } 100% { opacity: 0; transform: translate(26px,-40px) rotate(70deg); } }

  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .still-show { opacity: 1 !important; } }
</style>
