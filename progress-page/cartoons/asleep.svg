<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180">
<style>
  .ink { stroke: #2b2b2b; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
  .z, .bubble, .body, .star { transform-box: fill-box; transform-origin: center; }
  .z { animation: zz 3s ease-out infinite; opacity: 0; }
  .z.b { animation-delay: 1s; } .z.c { animation-delay: 2s; }
  @keyframes zz { 0% { opacity: 0; transform: translate(0,0) scale(.6); } 20% { opacity: 1; } 100% { opacity: 0; transform: translate(26px,-34px) scale(1.2); } }
  .bubble { transform-origin: 0% 50%; animation: snore 3s ease-in-out infinite; }
  @keyframes snore { 0%, 100% { transform: scale(.3); } 50% { transform: scale(1); } }
  .body { transform-origin: 50% 100%; animation: breathe 3s ease-in-out infinite; }
  @keyframes breathe { 50% { transform: scaleY(1.03); } }
  .star { animation: twinkle 2s ease-in-out infinite; }
  .star.b { animation-delay: 1s; }
  @keyframes twinkle { 50% { opacity: .25; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .z { opacity: 1; } }
</style>

<!-- night window -->
<rect class="ink" x="16" y="10" width="62" height="50" rx="6" fill="#364fc7"/>
<path class="ink" d="M47 10 v50 M16 35 h62" fill="none" stroke-width="2.4"/>
<path d="M30 20 a9 9 0 1 0 9 13 a7 7 0 1 1 -9 -13 z" fill="#ffe066"/>
<path class="star" d="M62 20 l1.5 3 3 1.5 -3 1.5 -1.5 3 -1.5 -3 -3 -1.5 3 -1.5 z" fill="#fff"/>
<path class="star b" d="M58 46 l1.2 2.4 2.4 1.2 -2.4 1.2 -1.2 2.4 -1.2 -2.4 -2.4 -1.2 2.4 -1.2 z" fill="#fff"/>

<rect class="ink" x="8" y="160" width="224" height="9" rx="3" fill="#b08968"/>

<g class="body">
  <!-- slumped body -->
  <path class="ink" d="M70 162 C72 128 96 112 130 112 C162 112 176 132 176 162 Z" fill="#4c6ef5"/>
  <!-- folded arms on the desk -->
  <rect class="ink" x="58" y="132" width="134" height="28" rx="14" fill="#4c6ef5"/>
  <path class="ink" d="M120 136 q-6 10 0 20" fill="none" stroke-width="2.4"/>
  <!-- head resting sideways -->
  <g transform="rotate(-18 112 108)">
    <circle class="ink" cx="112" cy="108" r="30" fill="#ffd7b0"/>
    <path class="ink" d="M82 106 C78 82 96 70 114 72 C134 72 148 86 142 106 C136 94 128 90 118 92 C114 84 104 84 98 92 C90 90 84 96 82 106 Z" fill="#3d2b1f"/>
    <!-- nightcap -->
    <path class="ink" d="M84 92 C86 66 128 58 140 80 C130 52 104 40 70 56 C80 66 82 78 84 92 Z" fill="#f03e3e"/>
    <circle class="ink" cx="68" cy="56" r="7" fill="#fff"/>
    <!-- closed eyes and open mouth -->
    <path class="ink" d="M98 108 q6 6 12 0 M120 108 q6 6 12 0" fill="none"/>
    <ellipse class="ink" cx="116" cy="125" rx="5" ry="4" fill="#a5523a" stroke-width="2.4"/>
  </g>
  <!-- snot bubble -->
  <circle class="ink bubble" cx="138" cy="112" r="9" fill="#d0ebff" fill-opacity=".8" stroke-width="2"/>
</g>

<text class="z" x="160" y="90" font-family="Comic Sans MS, Chalkboard SE, cursive" font-size="18" font-weight="700" fill="#2b2b2b">z</text>
<text class="z b" x="166" y="80" font-family="Comic Sans MS, Chalkboard SE, cursive" font-size="24" font-weight="700" fill="#2b2b2b">Z</text>
<text class="z c" x="172" y="70" font-family="Comic Sans MS, Chalkboard SE, cursive" font-size="30" font-weight="700" fill="#2b2b2b">Z</text>
</svg>
