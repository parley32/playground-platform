name: Progress page

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history, for the commit feed and the progress curve
      - run: python3 progress-page/build_data.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: progress-page
      - id: deployment
        uses: actions/deploy-pages@v4
